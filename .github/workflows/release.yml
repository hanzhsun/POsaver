name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (overrides event tag)'
        required: false

jobs:
  build-windows-exe:
    name: Build Windows one-file executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
      - name: Build one-file exe with PyInstaller
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Force one-file exe for Windows releases
          py -3 -m pip install --upgrade pip
          py -3 -m pip install pyinstaller
          py -3 -m PyInstaller --clean --noconfirm --onefile --name POsaver POsaver.py

      - name: Package Windows exe
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -Force artifacts
          if (Test-Path -Path dist\POsaver.exe) {
            Copy-Item -Path dist\POsaver.exe -Destination artifacts\POsaver.exe -Force
          } elseif (Test-Path -Path dist\POsaver\POsaver.exe) {
            Copy-Item -Path dist\POsaver\POsaver.exe -Destination artifacts\POsaver.exe -Recurse -Force
          }
          $out = "POsaver-$env:RELEASE_TAG-windows.zip"
          if (Test-Path -Path artifacts) { Compress-Archive -Path artifacts\* -DestinationPath $out -Force }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: POsaver-${{ github.ref_name }}-windows.zip

  build-macos-exe:
    name: Build macOS one-file executable
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build .app with PyInstaller (uses spec if present)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller
          if [ -f POsaver.spec ]; then
            python3 -m PyInstaller --clean --noconfirm POsaver.spec
          else
            # create a one-dir bundle and then convert to .app if needed
            python3 -m PyInstaller --clean --noconfirm --onedir --name POsaver POsaver.py
          fi

      - name: Package macOS .app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts
          if [ -d dist/POsaver.app ]; then
            cp -R dist/POsaver.app artifacts/
          elif [ -d dist/POsaver ]; then
            cp -R dist/POsaver artifacts/POsaver.app || true
          else
            # fallback: copy whatever is in dist
            cp -R dist/* artifacts/ || true
          fi
          cd artifacts || exit 0
          zip -r ../POsaver-${RELEASE_TAG}-macos.zip . || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-exe
          path: POsaver-${{ github.ref_name }}-macos.zip

  create-release:
    name: Create GitHub Release and attach artifacts
    needs: [build-windows-exe, build-macos-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-exe
          path: release-artifacts

      - name: Generate release notes
        id: notes
        run: |
          # Prefer the pushed tag; fall back to workflow input if provided
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${{ github.ref_name }}
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG=${{ github.event.inputs.tag }}
          else
            # fallback to latest tag
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "${{ github.sha }}")
          fi
          echo "Using tag: $TAG"
          echo "## Changes in $TAG" > release_notes.md
          git --no-pager log --pretty=format:"- %s (%h)" $TAG..HEAD >> release_notes.md || git --no-pager log -n 40 --pretty=format:"- %s (%h)" >> release_notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload files
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional: Publish to PyPI (if secret provided)
        if: secrets.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@v1.5.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
